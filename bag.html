<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#472D7C">
  <title>عرض وتحميل روزنامة معسكر الموظف الشامل</title>

  <style>
    :root {
      --c1: #64B687;
      --c2: #49A28F;
      --c3: #278F96;
      --c4: #472D7C;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-family: Tahoma, Arial, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, var(--c1), var(--c2), var(--c3), var(--c4));
      color: var(--c4);
    }

    header {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 12px clamp(12px, 3vw, 26px);
      border-bottom: 3px solid var(--c4);
      background: linear-gradient(105deg, var(--c1) 0%, var(--c2) 38%, var(--c3) 72%, var(--c4) 100%);
      box-shadow: 0 8px 22px rgba(71, 45, 124, 0.26);
      z-index: 10;
    }

    .title-wrap {
      min-width: 0;
      text-align: right;
    }

    .title {
      margin: 0;
      font-size: clamp(16px, 2.4vw, 21px);
      font-weight: 800;
      line-height: 1.5;
      color: var(--c4);
    }

    .file-name {
      margin: 2px 0 0;
      direction: ltr;
      text-align: right;
      font-size: clamp(11px, 1.8vw, 13px);
      font-weight: 700;
      color: var(--c4);
      overflow-wrap: anywhere;
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      flex-wrap: wrap;
    }

    .action-btn {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 9px 13px;
      border: 2px solid var(--c4);
      border-radius: 12px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 800;
      white-space: nowrap;
      color: var(--c1);
      background: linear-gradient(110deg, var(--c3), var(--c4));
      -webkit-tap-highlight-color: transparent;
    }

    .action-btn.secondary {
      color: var(--c4);
      background: linear-gradient(110deg, var(--c1), var(--c2));
    }

    .action-btn svg {
      width: 19px;
      height: 19px;
      flex: 0 0 19px;
      fill: currentColor;
    }

    .viewer {
      position: relative;
      flex: 1 1 auto;
      width: 100%;
      min-height: 0;
      background: var(--c1);
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: var(--c1);
    }

    .fallback {
      position: absolute;
      inset: auto 12px 12px 12px;
      z-index: 2;
      display: none;
      padding: 10px 12px;
      border: 2px solid var(--c4);
      border-radius: 12px;
      background: var(--c2);
      color: var(--c4);
      text-align: center;
      font-weight: 700;
    }

    @media (max-width: 720px) {
      header {
        align-items: stretch;
        flex-direction: column;
        padding: 10px 12px;
      }

      .title-wrap { text-align: center; }
      .file-name { text-align: center; }
      .actions { width: 100%; }
      .action-btn { flex: 1 1 150px; }
    }

    @media (max-width: 390px) {
      .action-btn { font-size: 13px; padding-inline: 9px; }
      .file-name { font-size: 11px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="title-wrap">
      <h1 class="title">روزنامة معسكر الموظف الشامل</h1>
      <p class="file-name">PCTT.Training.4th.Cohort.2026.pdf</p>
    </div>

    <nav class="actions" aria-label="خيارات الملف">
      <a id="directOpen" class="action-btn secondary" href="PCTT.Training.4th.Cohort.2026.pdf" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3h7v7h-2V6.41l-9.29 9.3-1.42-1.42 9.3-9.29H14V3ZM5 5h6v2H5v12h12v-6h2v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z"/></svg>
        <span>فتح PDF</span>
      </a>

      <a class="action-btn" href="PCTT.Training.4th.Cohort.2026.pdf" download="PCTT.Training.4th.Cohort.2026.pdf">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20h14v-2H5v2ZM19 9h-4V3H9v6H5l7 7 7-7Z"/></svg>
        <span>تحميل الملف</span>
      </a>
    </nav>
  </header>

  <main class="viewer">
    <iframe id="pdfViewer" title="استعراض ملف روزنامة معسكر الموظف الشامل" allow="fullscreen"></iframe>
    <div id="fallback" class="fallback">إذا لم يظهر الملف داخل الصفحة، استخدم زر «فتح PDF» بالأعلى.</div>
  </main>

  <script>
    (() => {
      const PDF_FILE = 'PCTT.Training.4th.Cohort.2026.pdf';
      const iframe = document.getElementById('pdfViewer');
      const directOpen = document.getElementById('directOpen');
      const fallback = document.getElementById('fallback');

      const isHttp = location.protocol === 'http:' || location.protocol === 'https:';
      const pdfUrl = isHttp ? new URL(PDF_FILE, location.href).href : PDF_FILE;

      directOpen.href = pdfUrl;

      if (isHttp) {
        iframe.src = 'https://docs.google.com/gview?embedded=1&url=' + encodeURIComponent(pdfUrl);
      } else {
        iframe.src = PDF_FILE;
      }

      const showFallback = () => {
        fallback.style.display = 'block';
      };

      const timer = setTimeout(showFallback, 12000);
      iframe.addEventListener('load', () => clearTimeout(timer), { once: true });
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#472D7C">
  <title>استعراض الروزنامة</title>

  <style>
    :root {
      --green:#64B687;
      --mint:#49A28F;
      --teal:#278F96;
      --purple:#472D7C;
      --white:#ffffff;
      --line:rgba(255,255,255,.28);
      --shadow:0 18px 48px rgba(28,18,66,.28);
    }

    * { box-sizing:border-box; }
    html, body { width:100%; height:100%; margin:0; }

    body {
      min-height:100vh;
      min-height:100dvh;
      display:flex;
      flex-direction:column;
      overflow:hidden;
      font-family:"Cairo","Tajawal",Tahoma,Arial,"Segoe UI",sans-serif;
      color:var(--white);
      background:
        radial-gradient(circle at 8% 5%, rgba(255,255,255,.17), transparent 24%),
        linear-gradient(115deg, var(--green) 0%, var(--mint) 28%, var(--teal) 57%, var(--purple) 100%);
    }

    .topbar {
      flex:0 0 auto;
      position:relative;
      z-index:10;
      min-height:78px;
      padding:12px clamp(14px,3vw,34px);
      display:grid;
      grid-template-columns:auto 1fr;
      align-items:center;
      gap:16px;
      border-bottom:1px solid var(--line);
      background:linear-gradient(105deg, rgba(100,182,135,.76), rgba(39,143,150,.80) 58%, rgba(71,45,124,.90));
      box-shadow:var(--shadow);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
    }

    .title-wrap {
      min-width:0;
      text-align:right;
    }

    .title {
      margin:0;
      font-size:clamp(18px,2vw,23px);
      font-weight:900;
      line-height:1.35;
      color:#fff;
    }

    .subtitle {
      margin:4px 0 0;
      font-size:12px;
      font-weight:700;
      color:rgba(255,255,255,.72);
    }

    .download-btn {
      min-height:50px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:9px;
      padding:11px 17px;
      border:1px solid rgba(255,255,255,.50);
      border-radius:16px;
      color:#fff;
      text-decoration:none;
      font-size:14px;
      font-weight:900;
      white-space:nowrap;
      background:linear-gradient(110deg, rgba(255,255,255,.20), rgba(71,45,124,.44));
      box-shadow:0 10px 26px rgba(28,18,66,.20), inset 0 1px 0 rgba(255,255,255,.25);
      transition:transform .2s ease, background .2s ease;
    }

    .download-btn:hover {
      transform:translateY(-2px);
      background:linear-gradient(110deg, rgba(255,255,255,.28), rgba(71,45,124,.58));
    }

    .download-btn svg {
      width:22px;
      height:22px;
      fill:none;
      stroke:currentColor;
      stroke-width:2;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .viewer-shell {
      flex:1 1 auto;
      min-height:0;
      padding:clamp(8px,1.2vw,14px);
      display:flex;
    }

    .viewer-card {
      position:relative;
      flex:1 1 auto;
      min-width:0;
      min-height:0;
      overflow:hidden;
      display:flex;
      border:1px solid rgba(255,255,255,.38);
      border-radius:22px;
      background:#fff;
      box-shadow:0 22px 54px rgba(28,18,66,.30);
    }

    iframe {
      display:block;
      flex:1 1 auto;
      width:100%;
      height:100%;
      min-height:0;
      border:0;
      background:#fff;
    }

    .loading {
      position:absolute;
      inset:0;
      z-index:3;
      display:grid;
      place-items:center;
      background:linear-gradient(135deg, rgba(100,182,135,.97), rgba(39,143,150,.97), rgba(71,45,124,.98));
      transition:opacity .3s ease, visibility .3s ease;
    }

    .loading.hidden {
      opacity:0;
      visibility:hidden;
      pointer-events:none;
    }

    .loader-box {
      display:grid;
      justify-items:center;
      gap:12px;
      text-align:center;
      padding:20px;
    }

    .spinner {
      width:42px;
      height:42px;
      border-radius:50%;
      border:3px solid rgba(255,255,255,.28);
      border-top-color:#fff;
      animation:spin .75s linear infinite;
    }

    .loader-text {
      margin:0;
      font-size:14px;
      font-weight:800;
      color:rgba(255,255,255,.92);
    }

    .fallback {
      position:absolute;
      left:14px;
      right:14px;
      bottom:14px;
      z-index:4;
      display:none;
      padding:11px 14px;
      border:1px solid rgba(255,255,255,.46);
      border-radius:14px;
      background:rgba(71,45,124,.94);
      color:#fff;
      text-align:center;
      font-size:13px;
      font-weight:700;
      box-shadow:0 12px 28px rgba(28,18,66,.22);
    }

    @keyframes spin { to { transform:rotate(360deg); } }

    @media (max-width:680px) {
      .topbar {
        min-height:auto;
        grid-template-columns:1fr;
        gap:9px;
        padding:9px 10px;
      }
      .title-wrap { text-align:center; }
      .download-btn { width:100%; min-height:46px; border-radius:14px; }
      .viewer-shell { padding:6px; }
      .viewer-card { border-radius:14px; }
    }

    @media (prefers-reduced-motion:reduce) {
      .download-btn, .loading { transition:none; }
      .spinner { animation:none; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="download-btn" href="PCTT.Training.4th.Cohort.2026.pdf" download="PCTT.Training.4th.Cohort.2026.pdf" aria-label="تحميل الروزنامة">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 3v12"/>
        <path d="m7.5 10.5 4.5 4.5 4.5-4.5"/>
        <path d="M5 20h14"/>
      </svg>
      <span>تحميل الروزنامة</span>
    </a>

    <div class="title-wrap">
      <h1 class="title">الروزنامة</h1>
      <p class="subtitle">النسخة الأولى · أغسطس 2026م</p>
    </div>
  </header>

  <main class="viewer-shell">
    <section class="viewer-card" aria-label="عارض الروزنامة">
      <div id="loading" class="loading" aria-live="polite">
        <div class="loader-box">
          <div class="spinner" aria-hidden="true"></div>
          <p class="loader-text">جارٍ فتح الروزنامة…</p>
        </div>
      </div>

      <iframe
        id="pdfViewer"
        title="استعراض ملف الروزنامة"
        src="PCTT.Training.4th.Cohort.2026.pdf#page=1&view=Fit&toolbar=1&navpanes=0&scrollbar=1"
        allow="fullscreen"
      ></iframe>

      <div id="fallback" class="fallback">
        إذا لم يظهر الملف داخل الصفحة، يمكنك تحميله من زر «تحميل الروزنامة» بالأعلى.
      </div>
    </section>
  </main>

  <script>
    (() => {
      const viewer = document.getElementById('pdfViewer');
      const loading = document.getElementById('loading');
      const fallback = document.getElementById('fallback');
      let loaded = false;

      const finish = () => {
        loaded = true;
        loading.classList.add('hidden');
      };

      viewer.addEventListener('load', finish, { once:true });

      setTimeout(() => {
        if (!loaded) {
          loading.classList.add('hidden');
          fallback.style.display = 'block';
        }
      }, 9000);
    })();
  </script>
</body>
</html>

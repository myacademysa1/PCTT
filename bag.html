<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#472D7C">
  <title>استعراض روزنامة معسكر الموظف الشامل</title>

  <style>
    :root {
      --green:#64B687;
      --mint:#49A28F;
      --teal:#278F96;
      --purple:#472D7C;
      --white:#ffffff;
      --line:rgba(255,255,255,.28);
      --shadow:0 18px 48px rgba(28,18,66,.28);
    }

    * { box-sizing:border-box; }
    html { width:100%; height:100%; -webkit-text-size-adjust:100%; }

    body {
      width:100%;
      height:100vh;
      height:100svh;
      height:100dvh;
      margin:0;
      display:flex;
      flex-direction:column;
      overflow:hidden;
      font-family:"Cairo","Tajawal",Tahoma,Arial,"Segoe UI",sans-serif;
      color:var(--white);
      background:
        radial-gradient(circle at 8% 5%, rgba(255,255,255,.17), transparent 24%),
        linear-gradient(115deg, var(--green) 0%, var(--mint) 28%, var(--teal) 57%, var(--purple) 100%);
    }

    .topbar {
      flex:0 0 auto;
      position:relative;
      z-index:10;
      padding:
        max(10px, env(safe-area-inset-top))
        max(14px, env(safe-area-inset-right))
        10px
        max(14px, env(safe-area-inset-left));
      display:grid;
      grid-template-columns:auto minmax(0,1fr);
      align-items:center;
      gap:14px;
      border-bottom:1px solid var(--line);
      background:linear-gradient(105deg, rgba(100,182,135,.76), rgba(39,143,150,.80) 58%, rgba(71,45,124,.90));
      box-shadow:var(--shadow);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
    }

    .title-wrap {
      min-width:0;
      display:flex;
      align-items:center;
      justify-content:flex-start;
      gap:10px;
      text-align:right;
    }

    .header-logo {
      width:42px;
      height:42px;
      flex:0 0 42px;
      object-fit:contain;
      filter:drop-shadow(0 5px 12px rgba(18,18,54,.18));
    }

    .title-box { min-width:0; }

    .title {
      margin:0;
      font-size:clamp(17px,2vw,22px);
      font-weight:900;
      line-height:1.35;
      color:#fff;
      text-wrap:balance;
    }

    .subtitle {
      margin:3px 0 0;
      font-size:12px;
      font-weight:700;
      color:rgba(255,255,255,.72);
    }

    .download-btn {
      min-height:48px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:9px;
      padding:10px 16px;
      border:1px solid rgba(255,255,255,.50);
      border-radius:15px;
      color:#fff;
      text-decoration:none;
      font-size:14px;
      font-weight:900;
      white-space:nowrap;
      background:linear-gradient(110deg, rgba(255,255,255,.20), rgba(71,45,124,.44));
      box-shadow:0 10px 26px rgba(28,18,66,.20), inset 0 1px 0 rgba(255,255,255,.25);
      transition:transform .2s ease, background .2s ease;
      -webkit-tap-highlight-color:transparent;
      touch-action:manipulation;
    }

    .download-btn:hover {
      transform:translateY(-2px);
      background:linear-gradient(110deg, rgba(255,255,255,.28), rgba(71,45,124,.58));
    }

    .download-btn svg {
      width:21px;
      height:21px;
      flex:0 0 21px;
      fill:none;
      stroke:currentColor;
      stroke-width:2;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .viewer-shell {
      flex:1 1 auto;
      min-height:0;
      padding:
        clamp(7px,1.1vw,12px)
        max(clamp(7px,1.1vw,12px), env(safe-area-inset-right))
        max(clamp(7px,1.1vw,12px), env(safe-area-inset-bottom))
        max(clamp(7px,1.1vw,12px), env(safe-area-inset-left));
      display:flex;
    }

    .viewer-card {
      position:relative;
      flex:1 1 auto;
      min-width:0;
      min-height:0;
      overflow:hidden;
      display:flex;
      border:1px solid rgba(255,255,255,.38);
      border-radius:20px;
      background:#fff;
      box-shadow:0 22px 54px rgba(28,18,66,.30);
    }

    .pdf-scroll {
      position:relative;
      flex:1 1 auto;
      min-width:0;
      min-height:0;
      overflow:auto;
      overscroll-behavior:contain;
      -webkit-overflow-scrolling:touch;
      background:#eef1f5;
      scrollbar-gutter:stable;
    }

    .pdf-pages {
      width:100%;
      min-height:100%;
      padding:10px;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:10px;
    }

    .pdf-page {
      width:min(100%, 1100px);
      min-height:120px;
      display:flex;
      justify-content:center;
      background:#fff;
      border-radius:8px;
      overflow:hidden;
      box-shadow:0 4px 14px rgba(28,18,66,.10);
    }

    .pdf-page canvas {
      display:block;
      max-width:100%;
      height:auto;
      background:#fff;
    }

    .page-indicator {
      position:absolute;
      z-index:5;
      left:50%;
      bottom:10px;
      transform:translateX(-50%);
      padding:7px 12px;
      border-radius:999px;
      background:rgba(71,45,124,.88);
      color:#fff;
      font-size:11px;
      font-weight:800;
      pointer-events:none;
      box-shadow:0 8px 20px rgba(28,18,66,.18);
      backdrop-filter:blur(8px);
      -webkit-backdrop-filter:blur(8px);
    }

    .loading {
      position:absolute;
      inset:0;
      z-index:3;
      display:grid;
      place-items:center;
      background:linear-gradient(135deg, rgba(100,182,135,.97), rgba(39,143,150,.97), rgba(71,45,124,.98));
      transition:opacity .3s ease, visibility .3s ease;
    }

    .loading.hidden {
      opacity:0;
      visibility:hidden;
      pointer-events:none;
    }

    .loader-box {
      display:grid;
      justify-items:center;
      gap:12px;
      text-align:center;
      padding:20px;
    }

    .spinner {
      width:42px;
      height:42px;
      border-radius:50%;
      border:3px solid rgba(255,255,255,.28);
      border-top-color:#fff;
      animation:spin .75s linear infinite;
    }

    .loader-text {
      margin:0;
      font-size:14px;
      font-weight:800;
      color:rgba(255,255,255,.92);
    }

    .fallback {
      position:absolute;
      left:12px;
      right:12px;
      bottom:12px;
      z-index:4;
      display:none;
      padding:10px 12px;
      border:1px solid rgba(255,255,255,.46);
      border-radius:13px;
      background:rgba(71,45,124,.94);
      color:#fff;
      text-align:center;
      font-size:12px;
      line-height:1.6;
      font-weight:700;
      box-shadow:0 12px 28px rgba(28,18,66,.22);
    }

    @keyframes spin { to { transform:rotate(360deg); } }

    @media (max-width:680px) {
      .topbar {
        grid-template-columns:1fr;
        gap:8px;
        padding-top:max(8px, env(safe-area-inset-top));
        padding-right:max(10px, env(safe-area-inset-right));
        padding-left:max(10px, env(safe-area-inset-left));
        padding-bottom:8px;
      }

      .title-wrap { justify-content:center; text-align:center; }
      .header-logo { width:34px; height:34px; flex-basis:34px; }
      .title { font-size:16px; }
      .subtitle { font-size:11px; }
      .download-btn { width:100%; min-height:44px; border-radius:13px; font-size:13px; }
      .viewer-shell { padding-top:6px; }
      .viewer-card { border-radius:13px; }
    }

    @media (max-width:430px) {
      .title-wrap { gap:7px; }
      .title { font-size:15px; }
      .subtitle { font-size:10.5px; }
      .download-btn { min-height:42px; }
      .viewer-shell { padding-left:max(5px, env(safe-area-inset-left)); padding-right:max(5px, env(safe-area-inset-right)); }
    }

    @media (orientation:landscape) and (max-height:560px) {
      .topbar {
        grid-template-columns:auto minmax(0,1fr);
        padding-top:max(6px, env(safe-area-inset-top));
        padding-bottom:6px;
      }
      .title-wrap { justify-content:flex-start; text-align:right; }
      .header-logo { width:32px; height:32px; flex-basis:32px; }
      .title { font-size:15px; }
      .subtitle { display:none; }
      .download-btn { width:auto; min-height:40px; }
      .viewer-shell { padding-top:5px; }
    }

    @media (prefers-reduced-motion:reduce) {
      .download-btn, .loading { transition:none; }
      .spinner { animation:none; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="download-btn" href="PCTT.Training.4th.Cohort.2026.pdf" download="PCTT.Training.4th.Cohort.2026.pdf" aria-label="تحميل روزنامة معسكر الموظف الشامل">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 3v12"/>
        <path d="m7.5 10.5 4.5 4.5 4.5-4.5"/>
        <path d="M5 20h14"/>
      </svg>
      <span>تحميل الروزنامة</span>
    </a>

    <div class="title-wrap">
      <img class="header-logo" src="https://up6.cc/2026/08/178645342757681.png" alt="شعار معسكر الموظف الشامل" loading="eager" referrerpolicy="no-referrer">
      <div class="title-box">
        <h1 class="title">روزنامة معسكر الموظف الشامل</h1>
        <p class="subtitle">النسخة الأولى · أغسطس 2026م</p>
      </div>
    </div>
  </header>

  <main class="viewer-shell">
    <section class="viewer-card" aria-label="عارض روزنامة معسكر الموظف الشامل">
      <div id="loading" class="loading" aria-live="polite">
        <div class="loader-box">
          <div class="spinner" aria-hidden="true"></div>
          <p class="loader-text">جارٍ فتح الروزنامة…</p>
        </div>
      </div>

      <div id="pdfScroll" class="pdf-scroll" role="document" aria-label="استعراض ملف روزنامة معسكر الموظف الشامل">
        <div id="pdfPages" class="pdf-pages"></div>
      </div>
      <div id="pageIndicator" class="page-indicator" hidden>الصفحة 1</div>

      <div id="fallback" class="fallback">
        إذا لم يظهر الملف داخل الصفحة، يمكنك تحميله من زر «تحميل الروزنامة» بالأعلى.
      </div>
    </section>
  </main>

  <script type="module">
    import * as pdfjsLib from 'https://unpkg.com/pdfjs-dist@6.1.200/build/pdf.min.mjs';

    (() => {
      const PDF_FILE = 'PCTT.Training.4th.Cohort.2026.pdf';
      const PDF_WORKER = 'https://unpkg.com/pdfjs-dist@6.1.200/build/pdf.worker.min.mjs';
      const pdfScroll = document.getElementById('pdfScroll');
      const pdfPages = document.getElementById('pdfPages');
      const loading = document.getElementById('loading');
      const loaderText = document.querySelector('.loader-text');
      const fallback = document.getElementById('fallback');
      const pageIndicator = document.getElementById('pageIndicator');

      pdfjsLib.GlobalWorkerOptions.workerSrc = PDF_WORKER;

      let pdfDoc = null;
      let nextPage = 1;
      let rendering = false;
      let firstPageShown = false;
      const rendered = new Set();

      const isMobile = matchMedia('(max-width: 680px)').matches;
      const pixelRatio = Math.min(window.devicePixelRatio || 1, isMobile ? 1.35 : 1.75);

      const showFallback = (message) => {
        loading.classList.add('hidden');
        fallback.textContent = message || 'تعذّر عرض الملف داخل الصفحة. يمكنك تحميله من زر «تحميل الروزنامة» بالأعلى.';
        fallback.style.display = 'block';
      };

      const updateIndicator = () => {
        if (!pdfDoc) return;
        const pages = [...pdfPages.querySelectorAll('.pdf-page')];
        if (!pages.length) return;
        const viewportTop = pdfScroll.scrollTop + 20;
        let current = 1;
        for (const el of pages) {
          if (el.offsetTop <= viewportTop + pdfScroll.clientHeight * 0.35) {
            current = Number(el.dataset.page || current);
          }
        }
        pageIndicator.textContent = `الصفحة ${current} من ${pdfDoc.numPages}`;
      };

      const renderPage = async (pageNumber) => {
        if (!pdfDoc || rendered.has(pageNumber)) return;
        rendered.add(pageNumber);

        const page = await pdfDoc.getPage(pageNumber);
        const baseViewport = page.getViewport({ scale: 1 });
        const availableWidth = Math.max(280, Math.min(pdfScroll.clientWidth - 20, 1100));
        const cssScale = availableWidth / baseViewport.width;
        const viewport = page.getViewport({ scale: cssScale * pixelRatio });

        const pageBox = document.createElement('div');
        pageBox.className = 'pdf-page';
        pageBox.dataset.page = String(pageNumber);
        pageBox.setAttribute('aria-label', `الصفحة ${pageNumber}`);

        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        canvas.width = Math.floor(viewport.width);
        canvas.height = Math.floor(viewport.height);
        canvas.style.width = `${Math.floor(viewport.width / pixelRatio)}px`;
        canvas.style.height = `${Math.floor(viewport.height / pixelRatio)}px`;
        pageBox.appendChild(canvas);
        pdfPages.appendChild(pageBox);

        await page.render({ canvasContext: ctx, viewport }).promise;
        page.cleanup();

        if (!firstPageShown) {
          firstPageShown = true;
          loading.classList.add('hidden');
          pageIndicator.hidden = false;
          updateIndicator();
        }
      };

      const renderNextBatch = async () => {
        if (!pdfDoc || rendering || nextPage > pdfDoc.numPages) return;
        rendering = true;
        try {
          const batchSize = isMobile ? 1 : 2;
          const last = Math.min(pdfDoc.numPages, nextPage + batchSize - 1);
          for (; nextPage <= last; nextPage += 1) {
            await renderPage(nextPage);
          }
        } finally {
          rendering = false;
        }
      };

      const maybeLoadMore = () => {
        updateIndicator();
        const remaining = pdfScroll.scrollHeight - pdfScroll.scrollTop - pdfScroll.clientHeight;
        if (remaining < Math.max(700, pdfScroll.clientHeight * 1.25)) {
          renderNextBatch().catch(() => showFallback());
        }
      };

      const start = async () => {
        try {
          const isHttp = location.protocol === 'http:' || location.protocol === 'https:';
          if (!isHttp) {
            showFallback('للعرض السريع افتحي هذه الصفحة من الموقع المنشور، وليس مباشرة من ملف HTML على الجهاز.');
            return;
          }

          const pdfUrl = new URL(PDF_FILE, location.href).href;
          const loadingTask = pdfjsLib.getDocument({
            url: pdfUrl,
            rangeChunkSize: 65536,
            disableRange: false,
            disableStream: false,
            disableAutoFetch: false
          });

          loadingTask.onProgress = ({ loaded, total }) => {
            if (loaderText && total) {
              const pct = Math.max(1, Math.min(99, Math.round((loaded / total) * 100)));
              loaderText.textContent = `جارٍ فتح الروزنامة… ${pct}%`;
            }
          };

          pdfDoc = await loadingTask.promise;
          await renderNextBatch();

          const idle = window.requestIdleCallback || ((cb) => setTimeout(cb, 250));
          idle(() => {
            if (nextPage <= pdfDoc.numPages) renderNextBatch().catch(() => {});
          });
        } catch (error) {
          console.error('PDF viewer error:', error);
          showFallback();
        }
      };

      pdfScroll.addEventListener('scroll', maybeLoadMore, { passive: true });
      window.addEventListener('resize', updateIndicator, { passive: true });

      start();
    })();
  </script>
</body>
</html>

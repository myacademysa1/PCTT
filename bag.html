<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#472D7C">
  <title>استعراض روزنامة معسكر الموظف الشامل</title>

  <style>
    :root {
      --green: #64B687;
      --mint: #49A28F;
      --teal: #278F96;
      --purple: #472D7C;
      --white: #ffffff;
      --line: rgba(255,255,255,.28);
      --shadow: 0 18px 48px rgba(31,20,66,.26);
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-family: "Cairo", "Tajawal", Tahoma, Arial, "Segoe UI", sans-serif;
      color: var(--white);
      background:
        radial-gradient(circle at 8% 5%, rgba(255,255,255,.18), transparent 24%),
        linear-gradient(115deg, var(--green) 0%, var(--mint) 29%, var(--teal) 58%, var(--purple) 100%);
    }

    .topbar {
      flex: 0 0 auto;
      position: relative;
      z-index: 20;
      padding: 12px clamp(14px, 3vw, 34px);
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 16px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(105deg, rgba(100,182,135,.80), rgba(39,143,150,.82) 58%, rgba(71,45,124,.90));
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .title-wrap {
      min-width: 0;
      text-align: right;
    }

    .title {
      margin: 0;
      font-size: clamp(17px, 2.2vw, 23px);
      line-height: 1.45;
      font-weight: 900;
      color: var(--white);
      text-shadow: 0 5px 18px rgba(31,20,66,.18);
    }

    .subtitle {
      margin: 3px 0 0;
      font-size: clamp(11px, 1.5vw, 13px);
      font-weight: 600;
      color: rgba(255,255,255,.76);
    }

    .download-btn {
      min-height: 50px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 11px 17px;
      border: 1px solid rgba(255,255,255,.50);
      border-radius: 16px;
      color: var(--white);
      text-decoration: none;
      font-size: 14px;
      font-weight: 900;
      white-space: nowrap;
      background: linear-gradient(110deg, rgba(255,255,255,.20), rgba(71,45,124,.44));
      box-shadow: 0 10px 26px rgba(31,20,66,.20), inset 0 1px 0 rgba(255,255,255,.25);
      transition: transform .2s ease, background .2s ease, box-shadow .2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .download-btn:hover {
      transform: translateY(-2px);
      background: linear-gradient(110deg, rgba(255,255,255,.28), rgba(71,45,124,.58));
      box-shadow: 0 14px 30px rgba(31,20,66,.26), inset 0 1px 0 rgba(255,255,255,.28);
    }

    .download-btn:active { transform: translateY(0); }
    .download-btn:focus-visible { outline: 3px solid rgba(255,255,255,.80); outline-offset: 3px; }

    .download-btn svg {
      width: 22px;
      height: 22px;
      flex: 0 0 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .viewer-shell {
      flex: 1 1 auto;
      min-height: 0;
      padding: clamp(10px, 1.4vw, 18px);
      display: flex;
    }

    .viewer-card {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.36);
      border-radius: clamp(16px, 2vw, 24px);
      background: rgba(255,255,255,.94);
      box-shadow: 0 22px 54px rgba(31,20,66,.28);
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      flex: 1 1 auto;
      min-height: 0;
      border: 0;
      background: #ffffff;
    }

    .loading {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, rgba(100,182,135,.96), rgba(39,143,150,.96), rgba(71,45,124,.97));
      color: var(--white);
      z-index: 3;
      transition: opacity .3s ease, visibility .3s ease;
    }

    .loading.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-box {
      display: grid;
      justify-items: center;
      gap: 13px;
      text-align: center;
      padding: 20px;
    }

    .spinner {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,.28);
      border-top-color: var(--white);
      animation: spin .75s linear infinite;
    }

    .loader-text {
      margin: 0;
      font-size: 14px;
      font-weight: 800;
      color: rgba(255,255,255,.92);
    }

    .fallback {
      position: absolute;
      inset: auto 14px 14px 14px;
      z-index: 4;
      display: none;
      padding: 11px 14px;
      border: 1px solid rgba(255,255,255,.46);
      border-radius: 14px;
      background: rgba(71,45,124,.92);
      color: var(--white);
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 12px 28px rgba(31,20,66,.22);
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 680px) {
      .topbar {
        grid-template-columns: 1fr;
        gap: 10px;
        padding: 10px 12px;
      }

      .title-wrap { text-align: center; }
      .download-btn { width: 100%; min-height: 48px; border-radius: 14px; }
      .viewer-shell { padding: 8px; }
      .viewer-card { border-radius: 15px; }
    }

    @media (max-width: 390px) {
      .title { font-size: 16px; }
      .subtitle { font-size: 11px; }
      .download-btn { font-size: 13px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .download-btn, .loading { transition: none; }
      .spinner { animation: none; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="download-btn" href="PCTT.Training.4th.Cohort.2026.pdf" download="PCTT.Training.4th.Cohort.2026.pdf" aria-label="تحميل روزنامة معسكر الموظف الشامل">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 3v12"/>
        <path d="m7.5 10.5 4.5 4.5 4.5-4.5"/>
        <path d="M5 20h14"/>
      </svg>
      <span>تحميل الروزنامة</span>
    </a>

    <div class="title-wrap">
      <h1 class="title">روزنامة معسكر الموظف الشامل</h1>
      <p class="subtitle">النسخة الأولى · أغسطس 2026م</p>
    </div>
  </header>

  <main class="viewer-shell">
    <section class="viewer-card" aria-label="عارض الروزنامة">
      <div id="loading" class="loading" aria-live="polite">
        <div class="loader-box">
          <div class="spinner" aria-hidden="true"></div>
          <p class="loader-text">جارٍ فتح الروزنامة…</p>
        </div>
      </div>

      <iframe
        id="pdfViewer"
        title="استعراض ملف روزنامة معسكر الموظف الشامل"
        src="PCTT.Training.4th.Cohort.2026.pdf#page=1&zoom=page-fit&toolbar=1&navpanes=0&scrollbar=1"
        allow="fullscreen"
      ></iframe>

      <div id="fallback" class="fallback">
        إذا لم يظهر الملف داخل الصفحة، يمكنك تحميله من زر «تحميل الروزنامة» بالأعلى.
      </div>
    </section>
  </main>

  <script>
    (() => {
      const viewer = document.getElementById('pdfViewer');
      const loading = document.getElementById('loading');
      const fallback = document.getElementById('fallback');
      let loaded = false;

      const finishLoading = () => {
        loaded = true;
        loading.classList.add('hidden');
      };

      viewer.addEventListener('load', finishLoading, { once: true });

      setTimeout(() => {
        if (!loaded) {
          loading.classList.add('hidden');
          fallback.style.display = 'block';
        }
      }, 9000);
    })();
  </script>
</body>
</html>

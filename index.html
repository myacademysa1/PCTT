<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta name="robots" content="index,follow,max-image-preview:large">

  <meta name="description" content="روزنامة معسكر الموظف الشامل - النسخة الأولى - أغسطس 2026م. فتح واستعراض ملف PDF على الجوال والتابلت والكمبيوتر.">
  <link rel="preload" as="image" href="cover.jpg">

  <meta property="og:locale" content="ar_SA">
  <meta property="og:type" content="website">
  <meta property="og:title" content="روزنامة معسكر الموظف الشامل - النسخة الأولى - أغسطس 2026م">

  <meta property="og:image" content="cover.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1280">
  <meta property="og:image:height" content="720">
  <meta property="og:image:alt" content="غلاف روزنامة معسكر الموظف الشامل">

  <style>
    :root {
      --green: #64B687;
      --mint: #49A28F;
      --teal: #278F96;
      --purple: #472D7C;
      --white: #ffffff;
      --glass: rgba(255,255,255,.12);
      --glass-strong: rgba(255,255,255,.18);
      --line: rgba(255,255,255,.26);
      --shadow: 0 30px 80px rgba(31, 20, 66, .30);
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      font-family: "Cairo", "Tajawal", Tahoma, Arial, "Segoe UI", sans-serif;
      color: var(--white);
      overflow-x: hidden;
      background:
        radial-gradient(circle at 10% 10%, rgba(255,255,255,.20), transparent 26%),
        radial-gradient(circle at 88% 24%, rgba(255,255,255,.10), transparent 26%),
        linear-gradient(125deg, var(--green) 0%, var(--mint) 27%, var(--teal) 58%, var(--purple) 100%);
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(1px);
      opacity: .35;
    }

    body::before {
      width: 420px;
      height: 420px;
      inset: -180px auto auto -140px;
      border: 1px solid rgba(255,255,255,.26);
      box-shadow: 0 0 0 70px rgba(255,255,255,.035), 0 0 0 145px rgba(255,255,255,.025);
    }

    body::after {
      width: 360px;
      height: 360px;
      inset: auto -160px -150px auto;
      border: 1px solid rgba(255,255,255,.22);
      box-shadow: 0 0 0 72px rgba(255,255,255,.035), 0 0 0 145px rgba(255,255,255,.02);
    }

    .page {
      width: min(1180px, calc(100% - 32px));
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 auto;
      padding: clamp(22px, 5vw, 64px) 0;
      display: grid;
      place-items: center;
      position: relative;
      z-index: 1;
    }

    .hero {
      width: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(320px, .95fr);
      align-items: center;
      gap: clamp(26px, 5vw, 62px);
      padding: clamp(18px, 3vw, 30px);
      border: 1px solid var(--line);
      border-radius: clamp(26px, 4vw, 42px);
      background: linear-gradient(140deg, rgba(255,255,255,.17), rgba(255,255,255,.07));
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      overflow: hidden;
      position: relative;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(115deg, rgba(255,255,255,.08), transparent 42%, rgba(255,255,255,.04));
      pointer-events: none;
    }

    .copy {
      position: relative;
      z-index: 1;
      padding: clamp(8px, 2vw, 22px);
      text-align: right;
    }

    .badge {
      width: fit-content;
      margin: 0 0 18px;
      padding: 9px 16px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.30);
      background: rgba(71,45,124,.26);
      font-size: clamp(13px, 1.6vw, 16px);
      font-weight: 700;
      letter-spacing: .1px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.18);
    }

    h1 {
      margin: 0;
      font-size: clamp(38px, 6vw, 68px);
      line-height: 1.22;
      font-weight: 900;
      text-wrap: balance;
      text-shadow: 0 8px 28px rgba(31,20,66,.22);
    }

    .subtitle {
      margin: 14px 0 6px;
      font-size: clamp(20px, 2.6vw, 28px);
      font-weight: 700;
      line-height: 1.55;
      color: rgba(255,255,255,.96);
    }

    .desc {
      margin: 0 0 26px;
      max-width: 620px;
      font-size: clamp(15px, 1.8vw, 18px);
      line-height: 1.9;
      color: rgba(255,255,255,.83);
    }

    .open-btn {
      min-height: 60px;
      width: min(100%, 430px);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 14px 22px;
      border: 1px solid rgba(255,255,255,.48);
      border-radius: 18px;
      text-decoration: none;
      color: var(--white);
      font-size: clamp(16px, 2vw, 19px);
      font-weight: 900;
      background: linear-gradient(105deg, rgba(255,255,255,.18), rgba(71,45,124,.43));
      box-shadow: 0 14px 34px rgba(31,20,66,.25), inset 0 1px 0 rgba(255,255,255,.25);
      transition: transform .22s ease, background .22s ease, box-shadow .22s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .open-btn:hover {
      transform: translateY(-3px);
      background: linear-gradient(105deg, rgba(255,255,255,.26), rgba(71,45,124,.55));
      box-shadow: 0 18px 40px rgba(31,20,66,.30), inset 0 1px 0 rgba(255,255,255,.30);
    }

    .open-btn:active { transform: translateY(0); }
    .open-btn:focus-visible { outline: 3px solid rgba(255,255,255,.78); outline-offset: 4px; }

    .open-btn svg {
      width: 26px;
      height: 26px;
      flex: 0 0 26px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .visual {
      position: relative;
      z-index: 1;
      padding: clamp(6px, 1.4vw, 12px);
    }

    .cover-wrap {
      position: relative;
      margin: 0;
      border-radius: clamp(20px, 3vw, 30px);
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.42);
      background: rgba(255,255,255,.08);
      box-shadow: 0 28px 55px rgba(31,20,66,.28);
      transform: perspective(1200px) rotateY(-2deg) rotateX(1deg);
    }

    .cover-wrap::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(125deg, rgba(255,255,255,.20), transparent 26%, transparent 70%, rgba(71,45,124,.16));
      pointer-events: none;
    }

    .cover-wrap img {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
    }

    .mini-note {
      margin: 15px 4px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: rgba(255,255,255,.78);
      font-size: 13px;
      text-align: center;
    }

    .mini-note svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.9;
    }

    @media (max-width: 860px) {
      .page { width: min(100% - 22px, 720px); padding-block: 18px; }
      .hero { grid-template-columns: 1fr; gap: 16px; padding: 16px; }
      .visual { order: -1; }
      .copy { text-align: center; padding-top: 6px; }
      .badge { margin-inline: auto; }
      .desc { margin-inline: auto; }
      .open-btn { width: 100%; }
      .cover-wrap { transform: none; }
    }

    @media (max-width: 480px) {
      .page { width: calc(100% - 16px); padding-block: 8px; }
      .hero { border-radius: 24px; padding: 10px; }
      .copy { padding: 8px 8px 14px; }
      .badge { margin-bottom: 12px; }
      .subtitle { margin-top: 10px; }
      .desc { margin-bottom: 18px; line-height: 1.75; }
      .open-btn { min-height: 56px; border-radius: 16px; }
      .cover-wrap { border-radius: 18px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .open-btn { transition: none; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero" aria-labelledby="page-title">
      <div class="copy">
        <p class="badge">النسخة الأولى · أغسطس 2026م</p>
        <h1 id="page-title">روزنامة معسكر الموظف الشامل</h1>
        <p class="subtitle">الروزنامة التدريبية في تجربة عرض أنيقة وواضحة</p>
        <p class="desc">انقر على الزر أدناه للانتقال إلى صفحة الاستعراض، وسيظهر ملف الروزنامة مباشرة داخل الصفحة مع إمكانية تحميله من الأعلى.</p>

        <a class="open-btn" href="bag.html" aria-label="فتح واستعراض روزنامة معسكر الموظف الشامل">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/>
            <circle cx="12" cy="12" r="2.8"/>
          </svg>
          <span>فتح واستعراض الروزنامة</span>
        </a>
      </div>

      <div class="visual">
        <figure class="cover-wrap">
          <img src="cover.jpg" alt="غلاف روزنامة معسكر الموظف الشامل" width="1280" height="720">
        </figure>
        <div class="mini-note" aria-hidden="true">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 2v4M16 2v4M3 9h18"/></svg>
          <span>متوافق مع الجوال والتابلت والكمبيوتر</span>
        </div>
      </div>
    </section>
  </main>
</body>
</html>

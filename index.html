  <style>
    :root {
      --c1: #64B687;
      --c2: #49A28F;
      --c3: #278F96;
      --c4: #472D7C;
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding: clamp(16px, 4vw, 44px);
      display: grid;
      place-items: center;
      font-family: Tahoma, Arial, "Segoe UI", sans-serif;
      color: var(--c4);
      background: linear-gradient(135deg, var(--c1) 0%, var(--c2) 34%, var(--c3) 67%, var(--c4) 100%);
    }

    .shell {
      width: min(100%, 1040px);
      border: 2px solid var(--c3);
      border-radius: clamp(20px, 3vw, 34px);
      overflow: hidden;
      background: linear-gradient(145deg, var(--c1) 0%, var(--c2) 100%);
      box-shadow: 0 22px 55px rgba(71, 45, 124, 0.34);
    }

    .accent {
      height: 10px;
      background: linear-gradient(90deg, var(--c1), var(--c2), var(--c3), var(--c4));
    }

    .content {
      display: grid;
      grid-template-columns: minmax(0, 1.08fr) minmax(280px, .92fr);
      gap: clamp(20px, 4vw, 44px);
      align-items: center;
      padding: clamp(18px, 4vw, 42px);
    }

    .preview {
      margin: 0;
      border-radius: clamp(16px, 2.4vw, 26px);
      overflow: hidden;
      border: 2px solid var(--c4);
      box-shadow: 0 16px 34px rgba(71, 45, 124, 0.28);
      background: var(--c3);
    }

    .preview img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      object-fit: cover;
    }

    .info {
      text-align: right;
    }

    .eyebrow {
      display: inline-block;
      margin: 0 0 12px;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: clamp(14px, 2vw, 16px);
      font-weight: 700;
      background: var(--c3);
      color: var(--c4);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(28px, 5vw, 48px);
      line-height: 1.25;
      color: var(--c4);
    }

    .subtitle {
      margin: 0 0 10px;
      font-size: clamp(18px, 2.8vw, 25px);
      line-height: 1.6;
      font-weight: 700;
      color: var(--c4);
    }

    .desc {
      margin: 0 0 22px;
      font-size: clamp(16px, 2.1vw, 19px);
      line-height: 1.9;
      color: var(--c4);
    }

    .btn {
      width: 100%;
      min-height: 56px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 20px;
      border: 2px solid var(--c4);
      border-radius: 16px;
      text-decoration: none;
      font-size: clamp(16px, 2.1vw, 19px);
      font-weight: 800;
      color: var(--c1);
      background: linear-gradient(110deg, var(--c3), var(--c4));
      box-shadow: 0 12px 26px rgba(71, 45, 124, 0.28);
      transition: transform .2s ease, box-shadow .2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:hover { transform: translateY(-2px); }
    .btn:active { transform: translateY(0); }
    .btn:focus-visible { outline: 4px solid var(--c3); outline-offset: 4px; }

    .btn svg {
      width: 24px;
      height: 24px;
      flex: 0 0 24px;
      fill: currentColor;
    }

    @media (max-width: 760px) {
      body { padding: 12px; }
      .content { grid-template-columns: 1fr; }
      .info { text-align: center; }
      .preview { order: -1; }
      .shell { border-radius: 22px; }
    }

    @media (max-width: 420px) {
      .content { padding: 14px; gap: 16px; }
      .btn { border-radius: 14px; min-height: 54px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .btn { transition: none; }
    }
  </style>

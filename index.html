  <style>
    :root {
      --green:#64B687;
      --mint:#49A28F;
      --teal:#278F96;
      --purple:#472D7C;
      --navy:#15345d;
      --white:#ffffff;
      --glass:rgba(255,255,255,.12);
      --line:rgba(255,255,255,.30);
      --shadow:0 30px 75px rgba(28,18,66,.32);
    }

    * { box-sizing:border-box; }
    html, body { min-height:100%; }

    body {
      margin:0;
      min-height:100vh;
      min-height:100dvh;
      overflow-x:hidden;
      font-family:"Cairo","Tajawal",Tahoma,Arial,"Segoe UI",sans-serif;
      color:var(--white);
      background:
        radial-gradient(circle at 9% 9%, rgba(255,255,255,.18), transparent 27%),
        radial-gradient(circle at 88% 20%, rgba(255,255,255,.08), transparent 24%),
        linear-gradient(123deg, var(--green) 0%, var(--mint) 27%, var(--teal) 55%, var(--purple) 100%);
    }

    body::before,
    body::after {
      content:"";
      position:fixed;
      pointer-events:none;
      border-radius:50%;
      border:1px solid rgba(255,255,255,.12);
      z-index:0;
    }

    body::before {
      width:430px;
      height:430px;
      top:-220px;
      left:-155px;
      box-shadow:0 0 0 90px rgba(255,255,255,.025), 0 0 0 180px rgba(255,255,255,.018);
    }

    body::after {
      width:390px;
      height:390px;
      right:-175px;
      bottom:-210px;
      box-shadow:0 0 0 90px rgba(255,255,255,.022), 0 0 0 180px rgba(255,255,255,.015);
    }

    .page {
      position:relative;
      z-index:1;
      width:min(1180px, calc(100% - 32px));
      min-height:100vh;
      min-height:100dvh;
      margin:0 auto;
      padding:clamp(18px,3vw,34px) 0;
      display:grid;
      place-items:center;
    }

    .shell {
      width:100%;
      overflow:hidden;
      border:1px solid var(--line);
      border-radius:34px;
      background:linear-gradient(145deg, rgba(255,255,255,.16), rgba(255,255,255,.07));
      box-shadow:var(--shadow);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
    }

    .topbar {
      min-height:70px;
      padding:14px clamp(18px,3vw,30px);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      border-bottom:1px solid rgba(255,255,255,.16);
      background:linear-gradient(105deg, rgba(100,182,135,.22), rgba(39,143,150,.18), rgba(71,45,124,.20));
    }

    .brand {
      display:flex;
      align-items:center;
      gap:10px;
      font-size:15px;
      font-weight:800;
      color:rgba(255,255,255,.94);
    }

    .brand-mark {
      width:34px;
      height:34px;
      border-radius:12px;
      display:grid;
      place-items:center;
      border:1px solid rgba(255,255,255,.32);
      background:rgba(255,255,255,.10);
      font-size:19px;
    }

    .edition {
      margin:0;
      padding:8px 14px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.30);
      background:rgba(71,45,124,.25);
      color:rgba(255,255,255,.96);
      font-size:13px;
      font-weight:800;
      white-space:nowrap;
    }

    .hero {
      display:grid;
      grid-template-columns:minmax(0,1fr) minmax(360px,.95fr);
      align-items:center;
      gap:clamp(28px,5vw,64px);
      padding:clamp(24px,4vw,52px);
    }

    .copy {
      text-align:right;
    }

    h1 {
      margin:0 0 20px;
      font-size:clamp(54px,8vw,88px);
      line-height:1;
      font-weight:900;
      letter-spacing:-1px;
      text-shadow:0 12px 34px rgba(26,16,64,.24);
    }

    .desc {
      margin:0 0 26px;
      max-width:600px;
      font-size:clamp(16px,1.8vw,19px);
      line-height:1.95;
      color:rgba(255,255,255,.83);
    }

    .open-btn {
      width:min(100%,440px);
      min-height:62px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      padding:14px 22px;
      border:1px solid rgba(255,255,255,.50);
      border-radius:18px;
      color:#fff;
      text-decoration:none;
      font-size:clamp(16px,2vw,19px);
      font-weight:900;
      background:linear-gradient(105deg, rgba(255,255,255,.17), rgba(71,45,124,.52));
      box-shadow:0 16px 34px rgba(28,18,66,.26), inset 0 1px 0 rgba(255,255,255,.24);
      transition:transform .22s ease, background .22s ease, box-shadow .22s ease;
    }

    .open-btn:hover {
      transform:translateY(-3px);
      background:linear-gradient(105deg, rgba(255,255,255,.25), rgba(71,45,124,.64));
      box-shadow:0 20px 42px rgba(28,18,66,.32), inset 0 1px 0 rgba(255,255,255,.28);
    }

    .open-btn svg {
      width:26px;
      height:26px;
      fill:none;
      stroke:currentColor;
      stroke-width:1.9;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .visual {
      min-width:0;
      display:grid;
      justify-items:center;
      gap:14px;
    }

    .cover-card {
      width:100%;
      margin:0;
      padding:10px;
      border:1px solid rgba(255,255,255,.40);
      border-radius:26px;
      background:linear-gradient(145deg, rgba(255,255,255,.16), rgba(255,255,255,.07));
      box-shadow:0 28px 55px rgba(26,16,64,.29);
    }

    .cover-card img {
      display:block;
      width:100%;
      height:auto;
      aspect-ratio:16/9;
      object-fit:contain;
      object-position:center;
      border-radius:18px;
      background:rgba(255,255,255,.06);
    }

    .note {
      margin:0;
      font-size:13px;
      color:rgba(255,255,255,.74);
      text-align:center;
    }

    @media (max-width:900px) {
      .page { width:min(100% - 20px,780px); }
      .hero { grid-template-columns:1fr; gap:24px; padding:20px; }
      .visual { order:-1; }
      .copy { text-align:center; }
      .desc { margin-inline:auto; }
      .open-btn { width:100%; }
      .topbar { padding-inline:16px; }
    }

    @media (max-width:520px) {
      .page { width:calc(100% - 12px); padding-block:8px; }
      .shell { border-radius:22px; }
      .topbar { min-height:auto; flex-direction:column; align-items:stretch; text-align:center; gap:9px; }
      .brand { justify-content:center; }
      .edition { width:fit-content; margin-inline:auto; }
      .hero { padding:12px; gap:18px; }
      h1 { margin-bottom:14px; font-size:clamp(46px,18vw,68px); }
      .desc { margin-bottom:18px; line-height:1.8; }
      .cover-card { padding:7px; border-radius:18px; }
      .cover-card img { border-radius:13px; }
      .open-btn { min-height:56px; border-radius:15px; }
    }

    @media (prefers-reduced-motion:reduce) {
      .open-btn { transition:none; }
    }
  </style>

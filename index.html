    :root {
      --green:#64B687;
      --mint:#49A28F;
      --teal:#278F96;
      --purple:#472D7C;
      --white:#ffffff;
      --glass:rgba(255,255,255,.12);
      --line:rgba(255,255,255,.30);
      --shadow:0 30px 75px rgba(28,18,66,.32);
    }

    * { box-sizing:border-box; }
    html { min-height:100%; -webkit-text-size-adjust:100%; }

    body {
      margin:0;
      min-height:100vh;
      min-height:100svh;
      min-height:100dvh;
      overflow-x:hidden;
      font-family:"Cairo","Tajawal",Tahoma,Arial,"Segoe UI",sans-serif;
      color:var(--white);
      background:
        radial-gradient(circle at 9% 9%, rgba(255,255,255,.18), transparent 27%),
        radial-gradient(circle at 88% 20%, rgba(255,255,255,.08), transparent 24%),
        linear-gradient(123deg, var(--green) 0%, var(--mint) 27%, var(--teal) 55%, var(--purple) 100%);
    }

    body::before,
    body::after {
      content:"";
      position:fixed;
      pointer-events:none;
      border-radius:50%;
      border:1px solid rgba(255,255,255,.12);
      z-index:0;
    }

    body::before {
      width:430px;
      height:430px;
      top:-220px;
      left:-155px;
      box-shadow:0 0 0 90px rgba(255,255,255,.025), 0 0 0 180px rgba(255,255,255,.018);
    }

    body::after {
      width:390px;
      height:390px;
      right:-175px;
      bottom:-210px;
      box-shadow:0 0 0 90px rgba(255,255,255,.022), 0 0 0 180px rgba(255,255,255,.015);
    }

    .page {
      position:relative;
      z-index:1;
      width:min(1180px, calc(100% - 28px));
      min-height:100vh;
      min-height:100svh;
      min-height:100dvh;
      margin:0 auto;
      padding:
        max(16px, env(safe-area-inset-top))
        max(0px, env(safe-area-inset-right))
        max(16px, env(safe-area-inset-bottom))
        max(0px, env(safe-area-inset-left));
      display:grid;
      place-items:center;
    }

    .shell {
      width:100%;
      overflow:hidden;
      border:1px solid var(--line);
      border-radius:34px;
      background:linear-gradient(145deg, rgba(255,255,255,.16), rgba(255,255,255,.07));
      box-shadow:var(--shadow);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
    }

    .topbar {
      min-height:72px;
      padding:14px clamp(16px,3vw,30px);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      border-bottom:1px solid rgba(255,255,255,.16);
      background:linear-gradient(105deg, rgba(100,182,135,.22), rgba(39,143,150,.18), rgba(71,45,124,.20));
    }

    .brand {
      min-width:0;
      display:flex;
      align-items:center;
      gap:10px;
      font-size:15px;
      font-weight:800;
      color:rgba(255,255,255,.94);
    }

    .brand-logo {
      width:42px;
      height:42px;
      flex:0 0 42px;
      object-fit:contain;
      filter:drop-shadow(0 5px 12px rgba(18,18,54,.18));
    }

    .brand-text {
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .edition {
      margin:0;
      padding:8px 14px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.30);
      background:rgba(71,45,124,.25);
      color:rgba(255,255,255,.96);
      font-size:13px;
      font-weight:800;
      white-space:nowrap;
    }

    .hero {
      display:grid;
      grid-template-columns:minmax(0,1fr) minmax(360px,.95fr);
      align-items:center;
      gap:clamp(26px,5vw,58px);
      padding:clamp(24px,4vw,48px);
    }

    .copy { min-width:0; text-align:right; }

    .title-line {
      margin:0 0 20px;
      display:flex;
      align-items:center;
      justify-content:flex-start;
      gap:14px;
    }

    .title-logo {
      width:clamp(54px,6.5vw,78px);
      height:clamp(54px,6.5vw,78px);
      flex:0 0 auto;
      object-fit:contain;
      filter:drop-shadow(0 10px 22px rgba(18,18,54,.22));
    }

    h1 {
      margin:0;
      min-width:0;
      font-size:clamp(38px,5.7vw,68px);
      line-height:1.15;
      font-weight:900;
      letter-spacing:-.5px;
      text-wrap:balance;
      text-shadow:0 12px 34px rgba(26,16,64,.24);
    }

    .desc {
      margin:0 0 26px;
      max-width:600px;
      font-size:clamp(16px,1.8vw,19px);
      line-height:1.95;
      color:rgba(255,255,255,.83);
    }

    .open-btn {
      width:min(100%,440px);
      min-height:62px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      padding:14px 22px;
      border:1px solid rgba(255,255,255,.50);
      border-radius:18px;
      color:#fff;
      text-decoration:none;
      font-size:clamp(16px,2vw,19px);
      font-weight:900;
      background:linear-gradient(105deg, rgba(255,255,255,.17), rgba(71,45,124,.52));
      box-shadow:0 16px 34px rgba(28,18,66,.26), inset 0 1px 0 rgba(255,255,255,.24);
      transition:transform .22s ease, background .22s ease, box-shadow .22s ease;
      -webkit-tap-highlight-color:transparent;
      touch-action:manipulation;
    }

    .open-btn:hover {
      transform:translateY(-3px);
      background:linear-gradient(105deg, rgba(255,255,255,.25), rgba(71,45,124,.64));
      box-shadow:0 20px 42px rgba(28,18,66,.32), inset 0 1px 0 rgba(255,255,255,.28);
    }

    .open-btn:focus-visible { outline:3px solid rgba(255,255,255,.78); outline-offset:4px; }

    .open-btn svg {
      width:26px;
      height:26px;
      flex:0 0 26px;
      fill:none;
      stroke:currentColor;
      stroke-width:1.9;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .visual {
      min-width:0;
      display:grid;
      justify-items:center;
      gap:12px;
    }

    .cover-card {
      width:100%;
      max-width:560px;
      margin:0;
      padding:10px;
      border:1px solid rgba(255,255,255,.40);
      border-radius:26px;
      background:linear-gradient(145deg, rgba(255,255,255,.16), rgba(255,255,255,.07));
      box-shadow:0 28px 55px rgba(26,16,64,.29);
    }

    .cover-card img {
      display:block;
      width:100%;
      height:auto;
      aspect-ratio:16/9;
      object-fit:contain;
      object-position:center;
      border-radius:18px;
      background:rgba(255,255,255,.06);
    }

    .note {
      margin:0;
      padding-inline:8px;
      font-size:13px;
      line-height:1.6;
      color:rgba(255,255,255,.74);
      text-align:center;
    }

    @media (max-width:980px) {
      .hero { grid-template-columns:1fr; gap:22px; padding:22px; }
      .visual { order:-1; }
      .copy { text-align:center; }
      .title-line { justify-content:center; }
      .desc { margin-inline:auto; }
      .open-btn { width:100%; }
      .cover-card { max-width:720px; }
    }

    @media (max-width:600px) {

        width:calc(100% - 12px);

        padding-bottom:max(8px, env(safe-area-inset-bottom));

      .edition { font-size:12px; padding:7px 12px; }

      .hero { padding:12px; gap:18px; }
      .cover-card { padding:7px; border-radius:18px; }
      .cover-card img { border-radius:13px; }

      .title-line {
        margin-bottom:14px;
        align-items:flex-start;
        gap:9px;
      }

      .title-logo {
        width:44px;
        height:44px;
        margin-top:2px;
      }

      h1 {
        font-size:clamp(30px,9.2vw,42px);
        line-height:1.22;
      }

      .desc {
        margin-bottom:18px;
        font-size:15px;
        line-height:1.75;
      }

      .open-btn { min-height:56px; border-radius:15px; font-size:16px; }
      .note { font-size:12px; }
    }

    @media (max-width:390px) {
      h1 { font-size:29px; }
      .title-logo { width:40px; height:40px; }
      .hero { padding:10px; }
      .open-btn { padding-inline:14px; }
    }

    @media (orientation:landscape) and (max-height:560px) and (min-width:650px) {
      .page { padding-block:8px; }
      .hero { grid-template-columns:minmax(0,1fr) minmax(300px,.9fr); padding:16px 18px; gap:24px; }
      .visual { order:0; }
      .copy { text-align:right; }
      .title-line { justify-content:flex-start; }
      h1 { font-size:clamp(32px,5vw,48px); }
      .desc { font-size:14px; line-height:1.65; margin-bottom:14px; }
      .open-btn { min-height:50px; }
      .cover-card { max-width:430px; }
      .note { display:none; }
    }

    @media (prefers-reduced-motion:reduce) {
